project:
  type: website
  output-dir: docs
  resources: 
    - "*.png"
    - "*.jpeg"
    - "*.svg"
    - "*.pdf"
    - CNAME
    
website:
  title: "GRAPES"
  favicon: www/logo.png
  site-url: https://www.raisins.live/
  navbar:
    logo: www/navlogo.png
    left:
      - href: index.qmd
        text: Home
      - about.qmd

format:
  html:
    theme:
      light:
        - journal
      dark:
        - slate
    css: styles.css 
    toc: false
    toc-depth: 2
    number-sections: true
    smooth-scroll: true
    code-tools: false
    page-layout: full
    lightbox: true

execute:
  freeze: auto
  echo: false

